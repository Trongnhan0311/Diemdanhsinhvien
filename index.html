<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEF Scanner - Điểm Danh</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d32f2f; text-align: center; margin-bottom: 10px; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; }
        #result-box { margin-top: 15px; padding: 10px; background: #e3f2fd; border-radius: 8px; border: 1px solid #2196f3; text-align: center; }
        .mssv-text { font-size: 1.5em; font-weight: bold; color: #1565c0; display: block; margin-top: 5px; }
        #status { font-weight: bold; color: #4caf50; }
    </style>
</head>
<body>

    <div class="container">
        <h2>UEF ĐIỂM DANH</h2>
        <div id="reader"></div>
        <div id="result-box">
            <span>Trạng thái: <span id="status">Sẵn sàng</span></span>
            <span class="mssv-text" id="scanned-result">---</span>
        </div>
    </div>

    <script>
        // 1. THAY LINK GOOGLE SCRIPT CỦA BẠN VÀO ĐÂY
        const SCRIPT_URL = "URL_GOOGLE_APPS_SCRIPT_CUA_BAN";

        function onScanSuccess(decodedText) {
            // Dừng quét tạm thời để xử lý dữ liệu
            html5QrCode.stop().then(() => {
                document.getElementById('scanned-result').innerText = decodedText;
                document.getElementById('status').innerText = "Đang gửi...";
                document.getElementById('status').style.color = "orange";

                // Gửi dữ liệu tới Google Sheets
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ mssv: decodedText })
                })
                .then(() => {
                    document.getElementById('status').innerText = "THÀNH CÔNG!";
                    document.getElementById('status').style.color = "green";
                    // Đợi 2 giây rồi khởi động lại camera để quét người tiếp theo
                    setTimeout(() => { startScanner(); }, 2000);
                })
                .catch(err => {
                    alert("Lỗi gửi dữ liệu: " + err);
                    startScanner();
                });
            });
        }

        const config = { 
            fps: 20, 
            qrbox: { width: 320, height: 120 }, // Khung dẹt chuyên dụng cho Barcode
            aspectRatio: 1.0
        };

        const html5QrCode = new Html5Qrcode("reader");

        const startScanner = () => {
            document.getElementById('status').innerText = "Đang tìm mã...";
            document.getElementById('status').style.color = "green";
            
            html5QrCode.start(
                { facingMode: "environment" }, // Ưu tiên camera sau
                config,
                onScanSuccess
            ).catch(err => {
                console.error("Không thể mở camera: ", err);
            });
        };

        // Bắt đầu chạy
        startScanner();
    </script>
</body>
</html>
